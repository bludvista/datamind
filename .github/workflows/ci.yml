name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        # CPU-only PyTorch first, so the multi-GB CUDA build is not downloaded
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run tests
        # The tests mock the LLM and the embedding model, so no API key or secrets are needed
        run: pytest

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build -t datamind:ci .

      - name: Smoke test
        # /health needs no API key; this checks the image starts and serves requests
        run: |
          docker run -d --name datamind -p 8000:8000 datamind:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 2
          done
          echo "Service did not become healthy in time"
          docker logs datamind
          exit 1
